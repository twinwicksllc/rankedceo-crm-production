name: QA Agent — Monthly Enduser UX Clarity Run

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  enduser-clarity:
    name: Enduser UX Clarity Run (qa.rankedceo.com)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa-agent/package-lock.json

      - name: Install QA agent dependencies
        working-directory: qa-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa-agent
        run: npx playwright install chromium --with-deps

      - name: Run enduser UX clarity suite
        working-directory: qa-agent
        env:
          # Target: stable qa.rankedceo.com environment
          QA_BASE_URL: https://qa.rankedceo.com
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_CLIENT_REVIEW_TOKEN: ${{ secrets.QA_CLIENT_REVIEW_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_ADMIN_EMAIL_NOTIFY: ${{ secrets.QA_ADMIN_EMAIL_NOTIFY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # Enduser test uses mock billing (no Stripe charges)
          QA_BILLING_MOCK: 'true'
        run: npx tsx src/cli.ts --scenario scenarios/enduser_clarity.yaml --mode full

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-enduser-evidence-${{ github.run_id }}
          path: qa-agent/evidence/
          retention-days: 30

      - name: Post summary to GitHub Actions
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const glob = require('glob')
            // Find most recent report.json
            const reports = glob.sync('qa-agent/evidence/*/report.json')
            if (reports.length === 0) {
              core.summary.addRaw('No report generated.').write()
              return
            }
            const report = JSON.parse(fs.readFileSync(reports[reports.length - 1], 'utf-8'))
            const statusEmoji = {
              pass: '✅',
              pass_with_findings: '⚠️',
              error: '❌',
              critical_halt: '🚨',
              running: '🔄'
            }[report.status] ?? '❓'

            await core.summary
              .addHeading('QA Agent — Monthly Enduser UX Clarity Run')
              .addRaw('Testing from the perspective of a non-tech-savvy user: obvious CTAs, clear navigation, "what do I do next" guidance.')
              .addBreak()
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Run ID', report.runId],
                ['Status', `${statusEmoji} ${report.status}`],
                ['Scenario', 'enduser_clarity'],
                ['Steps', `${report.passedSteps}/${report.totalSteps} passed`],
                ['Findings', `${report.findings.length} (${report.findings.filter(f => f.severity === 'critical').length} critical, ${report.findings.filter(f => f.severity === 'error').length} error, ${report.findings.filter(f => f.severity === 'warning').length} warning)`],
                ['Started', report.startedAt],
                ['Completed', report.completedAt],
              ])
              .addHeading('Focus Areas Tested', 3)
              .addUnorderedList([
                'Button labels are clear and action-oriented',
                'Visual hierarchy guides user to next action',
                'Error messages are helpful and non-technical',
                'Portal works on 1024x768 (older screen sizes)',
                'Logout is easily findable',
                'Help/Support links are visible',
                'Pricing information is clear with $ signs',
                'Empty states have guidance, not blank pages',
                'All tabs are labeled (not just icons)',
              ])
              .write()

      - name: Create issue on critical failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const glob = require('glob')
            const reports = glob.sync('qa-agent/evidence/*/report.json')
            if (reports.length === 0) return

            const report = JSON.parse(fs.readFileSync(reports[reports.length - 1], 'utf-8'))
            const criticalFindings = report.findings.filter(f => f.severity === 'critical')

            if (criticalFindings.length === 0) return

            const body = `
## Monthly Enduser UX Clarity Test — Critical Issues Found

Run ID: ${report.runId}

### Critical Findings

${criticalFindings.map(f => `- **${f.step_id}**: ${f.description}\n  - Severity: ${f.severity}\n  - Message: ${f.message}`).join('\n')}

### Next Steps

1. Review the findings above
2. Check the full report: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
3. Download evidence artifacts to see screenshots

Non-tech-savvy users are experiencing UX issues. Fix these before next month's run.

---
_Generated by QA Agent on ${{ github.event.repository.updated_at }}_
            `

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Enduser UX Clarity Issues — Run ${{ github.run_id }}`,
              body,
              labels: ['qa', 'ux-clarity', 'enduser-testing']
            })
