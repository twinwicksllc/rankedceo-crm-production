name: QA Agent — Monthly Enduser UX Clarity Run

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  enduser-clarity:
    name: Enduser UX Clarity Run (qa.rankedceo.com)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: qa-agent/package-lock.json

      - name: Install QA agent dependencies
        working-directory: qa-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa-agent
        run: npx playwright install chromium --with-deps

      - name: Run enduser UX clarity suite
        working-directory: qa-agent
        env:
          # Target: stable qa.rankedceo.com environment
          QA_BASE_URL: https://qa.rankedceo.com
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_CLIENT_REVIEW_TOKEN: ${{ secrets.QA_CLIENT_REVIEW_TOKEN }}
          # Task 9: known audit ID for PDF/results page assertions (info severity — skipped if unset)
          QA_AUDIT_ID: ${{ secrets.QA_AUDIT_ID }}
          # IMPORTANT: QA workflows must use QA-dedicated Supabase secrets only.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WAAS_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          WAAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          # If not already defined, add QA_SUPABASE_ANON_KEY in GitHub Actions secrets.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_ADMIN_EMAIL_NOTIFY: ${{ secrets.QA_ADMIN_EMAIL_NOTIFY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # Enduser test uses mock billing (no Stripe charges)
          QA_BILLING_MOCK: 'true'
        run: npx tsx src/cli.ts --scenario scenarios/enduser_clarity.yaml --mode full

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: qa-enduser-evidence-${{ github.run_id }}
          path: qa-agent/evidence/
          retention-days: 30

      - name: Post summary and create critical issues
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            
            // Find most recent report.json without glob
            const evidenceDir = 'qa-agent/evidence'
            let latestReport = null
            
            if (fs.existsSync(evidenceDir)) {
              const runs = fs.readdirSync(evidenceDir)
              for (const run of runs) {
                const reportPath = path.join(evidenceDir, run, 'report.json')
                if (fs.existsSync(reportPath)) {
                  latestReport = reportPath
                  break
                }
              }
            }
            
            if (!latestReport) {
              core.summary.addRaw('No report generated.').write()
              return
            }
            
            const report = JSON.parse(fs.readFileSync(latestReport, 'utf-8'))
            const statusEmoji = {
              pass: '✅',
              pass_with_findings: '⚠️',
              error: '❌',
              critical_halt: '🚨',
              running: '🔄'
            }[report.status] ?? '❓'

            // Post summary
            await core.summary
              .addHeading('QA Agent — Monthly Enduser UX Clarity Run')
              .addRaw('Testing from the perspective of a non-tech-savvy user: obvious CTAs, clear navigation, "what do I do next" guidance.')
              .addBreak()
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Run ID', report.runId],
                ['Status', `${statusEmoji} ${report.status}`],
                ['Scenario', 'enduser_clarity'],
                ['Steps', `${report.passedSteps}/${report.totalSteps} passed`],
                ['Findings', `${report.findings.length} (${report.findings.filter(f => f.severity === 'critical').length} critical, ${report.findings.filter(f => f.severity === 'error').length} error, ${report.findings.filter(f => f.severity === 'warning').length} warning)`],
                ['Started', report.startedAt],
                ['Completed', report.completedAt],
              ])
              .addHeading('Focus Areas Tested', 3)
              .addList([
                'Button labels are clear and action-oriented',
                'Visual hierarchy guides user to next action',
                'Error messages are helpful and non-technical',
                'Portal works on 1024x768 (older screen sizes)',
                'Logout is easily findable',
                'Help/Support links are visible',
                'Pricing information is clear with $ signs',
                'Empty states have guidance, not blank pages',
                'All tabs are labeled (not just icons)',
              ])
              .write()

            // Create issue on critical failure
            const criticalFindings = report.findings.filter(f => f.severity === 'critical')
            if (criticalFindings.length > 0) {
              const findingsText = criticalFindings.map(f => {
                return '- **' + f.step_id + '**: ' + f.description + '\n  - Severity: ' + f.severity + '\n  - Message: ' + f.message
              }).join('\n')
              
              const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
              const body = '## Monthly Enduser UX Clarity Test — Critical Issues Found\n\n' +
                'Run ID: ' + report.runId + '\n\n' +
                '### Critical Findings\n\n' +
                findingsText + '\n\n' +
                '### Next Steps\n\n' +
                '1. Review the findings above\n' +
                '2. Check the full report: ' + runUrl + '\n' +
                '3. Download evidence artifacts to see screenshots\n\n' +
                'Non-tech-savvy users are experiencing UX issues. Fix these before next month' + "'s" + ' run.\n\n' +
                '---\n' +
                '_Generated by QA Agent_'

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Enduser UX Clarity Issues — Run ' + context.runId,
                body: body,
                labels: ['qa', 'ux-clarity', 'enduser-testing']
              })
            }
