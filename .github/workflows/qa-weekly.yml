name: QA Agent — Weekly Full Lifecycle Run

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  full-lifecycle:
    name: Full Lifecycle Run (qa.rankedceo.com)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: qa-agent/package-lock.json

      - name: Install QA agent dependencies
        working-directory: qa-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa-agent
        run: npx playwright install chromium --with-deps

      - name: Run full lifecycle suite
        working-directory: qa-agent
        env:
          # Target: stable qa.rankedceo.com environment
          QA_BASE_URL: https://qa.rankedceo.com
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_CLIENT_REVIEW_TOKEN: ${{ secrets.QA_CLIENT_REVIEW_TOKEN }}
          # Task 9: known audit ID for PDF/results page assertions (info severity — skipped if unset)
          QA_AUDIT_ID: ${{ secrets.QA_AUDIT_ID }}
          # IMPORTANT: QA workflows must use QA-dedicated Supabase secrets only.
          NEXT_PUBLIC_WAAS_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          WAAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_ADMIN_EMAIL_NOTIFY: ${{ secrets.QA_ADMIN_EMAIL_NOTIFY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SELF_HEAL_PROVIDER: openai
          # Full run uses real Stripe test mode + Resend test mode
          QA_BILLING_MOCK: 'false'
        run: npm run full

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: qa-full-evidence-${{ github.run_id }}
          path: qa-agent/evidence/
          retention-days: 30

      - name: Post summary to GitHub Actions
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            // Find most recent report.json
            const evidenceDir = 'qa-agent/evidence'
            const reports = []
            if (fs.existsSync(evidenceDir)) {
              const subdirs = fs.readdirSync(evidenceDir)
              for (const subdir of subdirs) {
                const reportPath = path.join(evidenceDir, subdir, 'report.json')
                if (fs.existsSync(reportPath)) {
                  reports.push(reportPath)
                }
              }
            }
            if (reports.length === 0) {
              core.summary.addRaw('No report generated.').write()
              return
            }
            const report = JSON.parse(fs.readFileSync(reports[reports.length - 1], 'utf-8'))
            const statusEmoji = {
              pass: '✅',
              pass_with_findings: '⚠️',
              error: '❌',
              critical_halt: '🚨',
              running: '🔄'
            }[report.status] ?? '❓'

            await core.summary
              .addHeading('QA Agent — Weekly Full Lifecycle Run')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Run ID', report.runId],
                ['Status', `${statusEmoji} ${report.status}`],
                ['Scenario', report.scenario],
                ['Steps', `${report.passedSteps}/${report.totalSteps} passed`],
                ['Findings', `${report.findings.length} (${report.findings.filter(f => f.severity === 'critical').length} critical, ${report.findings.filter(f => f.severity === 'error').length} error, ${report.findings.filter(f => f.severity === 'warning').length} warning)`],
                ['Started', report.startedAt],
                ['Completed', report.completedAt],
              ])
              .write()
