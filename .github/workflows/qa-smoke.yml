name: QA Agent — PR Smoke Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: qa-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required so the workflow can post comments back to the PR
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  smoke:
    name: Smoke Suite (PR #${{ github.event.pull_request.number }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: qa-agent/package-lock.json

      - name: Install QA agent dependencies
        working-directory: qa-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa-agent
        run: npx playwright install chromium --with-deps

      - name: Check QA_BASE_URL prerequisite
        id: prereqs
        env:
          QA_BASE_URL: ${{ secrets.QA_PREVIEW_BASE_URL }}
        run: |
          if [ -z "$QA_BASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  QA_PREVIEW_BASE_URL secret is not set — smoke suite skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke suite
        if: steps.prereqs.outputs.skip == 'false'
        working-directory: qa-agent
        env:
          # Target: Vercel preview URL for this PR
          # Use existing repo secret names; keep fallback order to avoid empty envs.
          # Preferred: QA_PREVIEW_BASE_URL (explicit smoke target)
          # Fallback: Vercel preview URL if your org exposes it as VERCEL_URL
          QA_BASE_URL: ${{ secrets.QA_PREVIEW_BASE_URL || secrets.VERCEL_URL }}
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_CLIENT_REVIEW_TOKEN: ${{ secrets.QA_CLIENT_REVIEW_TOKEN }}
          # Task 9: known audit ID for PDF/results page assertions (info severity — skipped if unset)
          QA_AUDIT_ID: ${{ secrets.QA_AUDIT_ID }}
          # IMPORTANT: QA workflows must use QA-dedicated Supabase secrets only.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WAAS_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          WAAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          # If not already defined, add QA_SUPABASE_ANON_KEY in GitHub Actions secrets.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_ADMIN_EMAIL_NOTIFY: ${{ secrets.QA_ADMIN_EMAIL_NOTIFY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          SELF_HEAL_PROVIDER: openai
          # Smoke always mocks billing + skips email
          QA_BILLING_MOCK: "true"
          # Explicitly disable restart gate for PR smoke runs
          QA_RESTART_GATE: "false"
        run: npm run smoke

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: qa-smoke-evidence-pr-${{ github.event.pull_request.number }}
          path: qa-agent/evidence/
          retention-days: 7

      - name: Post smoke result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Smoke passed' : '❌ Smoke failed'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### QA Agent — Smoke Result\n${status}\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })
