name: QA Agent — PR Smoke Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: qa-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required so the workflow can post comments back to the PR
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  smoke:
    name: Smoke Suite (PR #${{ github.event.pull_request.number }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1

      - name: Setup Node 24
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: qa-agent/package-lock.json

      - name: Install QA agent dependencies
        working-directory: qa-agent
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa-agent
        run: npx playwright install chromium --with-deps

      - name: Apply QA schema migration (idempotent)
        # Ensures qa.qa_runs and qa.qa_scenarios exist before the agent tries to write reports.
        # Migration is idempotent (CREATE SCHEMA IF NOT EXISTS / CREATE TABLE IF NOT EXISTS).
        # Skips gracefully when SUPABASE_DB_URL is not set — the smoke run still proceeds;
        # the Supabase report channel will warn but results are saved to disk + GitHub summary.
        #
        # NOTE on if: condition — GitHub Actions cannot compare secret values in expressions
        # (secrets are masked and always resolve to empty string in conditions).  We use an
        # env var proxy: SUPABASE_DB_URL is set from the secret, then checked with bash -n.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [[ -z "${SUPABASE_DB_URL}" ]]; then
            echo "⚠️  SUPABASE_DB_URL not set — skipping qa schema migration (non-fatal)"
            exit 0
          fi
          # Install psql client (not present by default on ubuntu-latest)
          sudo apt-get install -y postgresql-client --quiet 2>/dev/null || true
          psql "$SUPABASE_DB_URL" -f supabase/migrations/waas/021_qa_schema.sql

      - name: Run smoke suite
        working-directory: qa-agent
        env:
          # Target: Vercel preview URL for this PR
          # Set QA_PREVIEW_BASE_URL secret to your production/staging URL
          # (e.g. https://ranked-ceo-crm.vercel.app) until per-PR preview URLs are wired up
          QA_BASE_URL: ${{ secrets.QA_PREVIEW_BASE_URL }}
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_CLIENT_REVIEW_TOKEN: ${{ secrets.QA_CLIENT_REVIEW_TOKEN }}
          # Task 9: known audit ID for PDF/results page assertions (info severity — skipped if unset)
          QA_AUDIT_ID: ${{ secrets.QA_AUDIT_ID }}
          # WaaS-prefixed Supabase variable names (this Vercel project serves both WaaS + CRM)
          NEXT_PUBLIC_WAAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WAAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_ADMIN_EMAIL_NOTIFY: ${{ secrets.QA_ADMIN_EMAIL_NOTIFY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # Smoke always mocks billing + skips email
          QA_BILLING_MOCK: 'true'
          # Explicitly disable restart gate for PR smoke runs
          QA_RESTART_GATE: 'false'
        run: npm run smoke

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: qa-smoke-evidence-pr-${{ github.event.pull_request.number }}
          path: qa-agent/evidence/
          retention-days: 7

      - name: Post smoke result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Smoke passed' : '❌ Smoke failed'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### QA Agent — Smoke Result\n${status}\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })
