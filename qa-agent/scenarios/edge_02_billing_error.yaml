id: edge_02_billing_error
name: "Edge 02 — Billing Errors & Declined Card"
description: >
  Validates that the billing flow handles Stripe-declined cards gracefully,
  shows user-visible error feedback, does not create a subscription on a
  decline, and allows the user to retry with a valid card.
  Uses Stripe test card 4000 0000 0000 0002 (generic decline).
modes:
  - full

steps:
  # ── Scene 01: Admin login ─────────────────────────────────────────────────
  - id: e02_s01_navigate_login
    type: navigate
    persona: admin
    severity: info
    url: "{{ BASE_URL }}/login?next=/admin/dashboard&adminOnly=1"
    description: "Navigate to admin login"
    intent: "Opens admin login page — required before the admin can retrieve client portal links or verify subscription state after a billing error"

  - id: e02_s02_fill_email
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-email"], input#email, input[type="email"]'
    value: "{{ ADMIN_EMAIL }}"
    description: "Fill admin email"
    intent: "Fills the admin email input — selector maps to [data-testid='admin-email'] in app/(auth)/login/page.tsx"

  - id: e02_s03_fill_pass
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-password"], input#password, input[type="password"]'
    value: "{{ ADMIN_PASSWORD }}"
    description: "Fill admin password"
    intent: "Fills the admin password input — selector maps to [data-testid='admin-password'] in app/(auth)/login/page.tsx"

  - id: e02_s04_submit
    type: click
    persona: admin
    severity: info
    selector: '[data-testid="admin-login-submit"], button[type="submit"]'
    description: "Submit admin login"
    intent: "Submits admin credentials — triggers the login server action which calls supabase.auth.signInWithPassword() and redirects to /admin/dashboard on success"

  - id: e02_s05_assert_dashboard
    type: assert_url
    persona: admin
    severity: critical
    pattern: "/admin/dashboard"
    description: "Admin must be on dashboard"
    intent: "Verifies admin login succeeded and the redirect to /admin/dashboard occurred — critical because all subsequent admin steps require authentication"

  - id: e02_s06_assert_clients_table
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='waas-clients-table']"
    contains: ""
    description: "WaaS clients table must be present before billing test"
    intent: "Confirms the dashboard is fully rendered before switching to client — if the clients table is missing, the dashboard has an error that may indicate a broader data layer problem affecting billing"

  # ── Scene 02: Client billing tab ─────────────────────────────────────────
  - id: e02_s07_handoff_admin_to_client
    type: handoff
    persona: admin
    severity: info
    from: admin
    to: client
    message: "Admin dashboard verified — switching to client to test declined card flow"
    description: "Switch persona to client"
    intent: "Cross-persona handoff from admin to client — the client context navigates to the portal URL set in RunConfig.clientCredentials.reviewToken"

  - id: e02_s08_navigate_portal
    type: navigate
    persona: client
    severity: critical
    url: "{{ BASE_URL }}/edit/{{ CLIENT_REVIEW_TOKEN }}"
    description: "Client navigates to their portal"
    intent: "Navigates to the client portal using the test review token — the portal page at app/edit/[reviewToken] looks up the token and renders the PortalShell component"

  - id: e02_s09_assert_portal
    type: assert_text
    persona: client
    severity: critical
    selector: "[data-testid='client-portal-root']"
    contains: ""
    description: "Client portal root must be present"
    intent: "The data-testid='client-portal-root' div is the outermost wrapper of portal-shell.tsx — its absence means either the token lookup failed or the React component threw during render"

  - id: e02_s10_click_billing_tab
    type: click
    persona: client
    severity: error
    selector: "[data-testid='portal-tab-billing']"
    description: "Click the billing tab"
    intent: "Clicks the billing tab button in portal-shell.tsx — the selector data-testid='portal-tab-billing' is set on the tab button element. If missing, check that the billing tab is included in the tabs array and the data-testid pattern portal-tab-{tab.id} is applied"

  - id: e02_s11_assert_billing_content
    type: assert_text
    persona: client
    severity: error
    selector: "[data-testid='billing-tab-content']"
    contains: ""
    description: "Billing tab content must render"
    intent: "The data-testid='billing-tab-content' wrapper is set in billing-tab.tsx — it must render the plan cards and upgrade buttons. If missing, check that the BillingTab component is not suspended or crashing on Stripe price data fetch"

  # ── Scene 03: Declined card attempt ──────────────────────────────────────
  - id: e02_s12_click_upgrade
    type: click
    persona: client
    severity: error
    selector: "[data-testid='upgrade-btn-pro']"
    description: "Click the Pro plan upgrade button"
    intent: "If upgrade button is missing, the billing tab did not render the plan cards — check upgrade-plan-card-pro"

  - id: e02_s13_wait_checkout
    type: wait_for
    persona: client
    severity: info
    selector: "body"
    timeout_ms: 8000
    description: "Wait for Stripe checkout page or modal to appear"
    intent: "After clicking the upgrade button, the app creates a Stripe Checkout Session and redirects to stripe.com/pay/... — this wait gives the redirect up to 8s to complete. If this step times out, check that the createCheckoutSession server action is returning the correct redirect URL"

  - id: e02_s14_wait_post_decline
    type: wait_for
    persona: client
    severity: info
    selector: "body"
    timeout_ms: 4000
    description: "Wait for decline response after StripeAdapter fills declined card (4000000000000002)"
    intent: "v1.5: StripeAdapter should gain a 'declined' mode that fills 4000000000000002 — this wait step will then follow an actual fill step"

  # ── Scene 04: Portal intact after decline ─────────────────────────────────
  - id: e02_s15_navigate_portal_again
    type: navigate
    persona: client
    severity: critical
    url: "{{ BASE_URL }}/edit/{{ CLIENT_REVIEW_TOKEN }}"
    description: "Return to portal after declined checkout attempt"
    intent: "After a failed or cancelled checkout, navigates back to the portal to verify it still loads correctly — the portal must not be in a broken state due to a partially-created subscription or session corruption from the Stripe redirect"

  - id: e02_s16_assert_portal_intact
    type: assert_text
    persona: client
    severity: critical
    selector: "[data-testid='client-portal-root']"
    contains: ""
    description: "Portal must still be accessible after a failed checkout"
    intent: "A broken portal after failed checkout means users are locked out — escalate"

  - id: e02_s17_handoff_back_to_admin
    type: handoff
    persona: client
    severity: info
    from: client
    to: admin
    message: "Client declined-card path tested — returning to admin to verify no orphan records"
    description: "Return to admin persona to verify no orphan records"
    intent: "Cross-persona handoff back to admin — we want to verify the admin dashboard is unaffected by the failed billing attempt and that no orphaned subscription records were created"

  - id: e02_s18_assert_admin_dashboard_intact
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='admin-dashboard-root']"
    contains: ""
    description: "Admin dashboard must still be functional after billing edge case run"
    intent: "Final health check — the admin dashboard root must still be present, confirming no state corruption occurred in the admin context during the client billing error path"
