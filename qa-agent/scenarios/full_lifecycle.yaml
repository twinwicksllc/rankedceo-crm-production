id: full_lifecycle
name: Full Lifecycle — End-to-End Client & Admin Journey
description: >
  Complete end-to-end test covering the full WaaS lifecycle:
  onboarding entry-point check → admin creates tenant → client portal access
  → profile review → billing upgrade (Stripe test mode) → email verification
  → admin verifies state → client site published.

  Requires: Stripe test mode, Resend test mode.
  Target: qa.rankedceo.com (weekly run only).
  Runtime: ~15-25 minutes.

modes:
  - full
requires_stripe: true
requires_email: true

steps:

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 0: Onboarding entry-point health check
  # Verifies /get-started and the 6-step flow renders before the admin scenes.
  # The full step-by-step onboarding drive is in onboarding_waas.yaml.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s0_onboarding_route_loads
    type: navigate
    persona: client
    severity: critical
    description: "Scene 0 — /get-started onboarding entry point is reachable"
    url: /get-started
    intent: >
      The WaaS onboarding flow at /get-started must be reachable before
      running the rest of the lifecycle. A failure here aborts the run
      (critical) since the full lifecycle assumes a functioning onboarding
      flow as its prerequisite.

  - id: s0_onboarding_step1_renders
    type: wait_for
    persona: client
    severity: critical
    description: "Scene 0 — Step 1 Business Identity form renders"
    selector: 'h1, form, input[name="legal_name"], input[type="email"]'
    timeout_ms: 20000
    intent: >
      OnboardingFlow renders StepBusinessIdentity (Step 1) on mount.
      A failure here means the React client component failed to hydrate,
      a required import (e.g. @dnd-kit) is missing from the bundle, or
      the Supabase client initialisation in onboarding actions threw.

  - id: s0_onboarding_note
    type: pause
    persona: client
    severity: info
    description: "Scene 0 complete — deep onboarding drive (all 6 steps) runs in onboarding_waas scenario"
    duration_ms: 500
    intent: >
      The full 6-step onboarding drive including the Blocksmith website
      builder (Step 6) is covered by the standalone onboarding_waas.yaml
      scenario. This scene only validates the entry-point is healthy.

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 1: Admin — Login & Dashboard
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s1_admin_navigate_login
    type: navigate
    persona: admin
    severity: critical
    description: Admin navigates to login page
    url: /login?next=/admin/dashboard&adminOnly=1
    intent: Land on the admin login page

  - id: s1_admin_fill_email
    type: fill
    persona: admin
    severity: critical
    description: Fill admin email
    selector: '[data-testid="admin-email"]'
    value: '${QA_ADMIN_EMAIL}'
    intent: Enter admin email into login form

  - id: s1_admin_fill_password
    type: fill
    persona: admin
    severity: critical
    description: Fill admin password
    selector: '[data-testid="admin-password"]'
    value: '${QA_ADMIN_PASSWORD}'
    intent: Enter admin password into login form

  - id: s1_admin_submit_login
    type: click
    persona: admin
    severity: critical
    description: Submit admin login
    selector: '[data-testid="admin-login-submit"]'
    intent: Click the login submit button

  - id: s1_admin_wait_for_redirect
    type: wait_for_url
    persona: admin
    severity: warning
    description: Wait for URL to change to /admin/dashboard after login
    pattern: /admin/dashboard
    timeout_ms: 45000
    retries: 1
    intent: >-
      After clicking submit, signInWithPassword runs asynchronously and
      router.push navigates to /admin/dashboard. waitForURL handles both
      soft SPA navigations and hard full-page reloads triggered by router.push.
      30s timeout allows for slow network or server-side component rendering.

  - id: s1_admin_navigate_dashboard_explicit
    type: navigate
    persona: admin
    severity: critical
    description: Navigate explicitly to /admin/dashboard after login submit
    url: /admin/dashboard
    intent: >-
      Explicitly navigate to /admin/dashboard after login submit to avoid
      client-side router transition flakiness in CI. If authentication is
      valid, middleware allows access; otherwise this will redirect back to
      /login and the next assert_url will fail with a clear auth signal.

  - id: s1_admin_assert_dashboard
    type: assert_url
    persona: admin
    severity: critical
    description: Confirm redirect to admin dashboard path
    pattern: /admin/dashboard$
    intent: >-
      Verify admin landed on /admin/dashboard. Matches the path exactly,
      works with both qa.rankedceo.com and any other domain.

  - id: s1_admin_assert_heading
    type: assert_text
    persona: admin
    severity: warning
    description: Dashboard heading is present
    selector: '[data-testid="admin-dashboard-heading"]'
    contains: Command Center
    intent: The Command Center heading should be visible

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 2: Admin — Verify Revenue Widget
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s2_admin_revenue_widget
    type: wait_for
    persona: admin
    severity: warning
    description: Revenue widget renders
    selector: '[data-testid="revenue-widget"]'
    timeout_ms: 10000
    intent: The WaaS revenue widget should render on the dashboard

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 3: Admin — WaaS Clients List
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s3_admin_navigate_clients
    type: navigate
    persona: admin
    severity: warning
    description: Navigate to WaaS clients list
    url: /admin/dashboard
    intent: Navigate to admin dashboard where tenant list lives

  - id: s3_admin_assert_clients_table
    type: wait_for
    persona: admin
    severity: warning
    description: Tenant list renders
    selector: '[data-testid="waas-clients-table"]'
    timeout_ms: 15000
    intent: The tenant/clients table should render

  - id: s3_admin_assert_tenants_table
    type: wait_for
    persona: admin
    severity: warning
    description: Inner tenants table loads
    selector: '[data-testid="tenants-table"]'
    timeout_ms: 10000
    intent: The inner tenants table should be visible

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 4: Handoff — Admin → Client (initial portal check)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s4_handoff_admin_to_client
    type: handoff
    persona: admin
    severity: info
    description: Switch to client persona for portal checks
    from: admin
    to: client
    message: Admin setup verified — switching to client portal
    intent: Cross-persona handoff from admin to client context

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 5: Client — Portal Loads
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s5_client_assert_portal_url
    type: assert_url
    persona: client
    severity: critical
    description: Client is on edit portal URL
    pattern: /edit/
    intent: Client should be on their edit portal URL

  - id: s5_client_portal_root_loads
    type: wait_for
    persona: client
    severity: critical
    description: Client portal root element renders
    selector: '[data-testid="client-portal-root"]'
    timeout_ms: 15000
    intent: The client portal root should render its main content

  - id: s5_client_assert_overview_tab
    type: wait_for
    persona: client
    severity: warning
    description: Overview tab is visible
    selector: '[data-testid="portal-tab-overview"]'
    timeout_ms: 8000
    intent: The overview tab button should be visible

  # ───────────────────────────────────────────────────────────────────────────
  # SCENE 5b: Task 7 — Status strip / SLA timeline visible on overview tab
  # ───────────────────────────────────────────────────────────────────────────

  - id: s5b_client_assert_status_strip
    type: wait_for
    persona: client
    severity: warning
    description: "Task 7 — StatusStrip \"Your Launch Journey\" SLA timeline renders"
    # StatusStrip renders with aria-label="Website launch progress" (role=list)
    # and an h2 heading "Your Launch Journey" inside overview-tab-content
    selector: '[aria-label="Website launch progress"], [data-testid="overview-tab-content"] h2'
    timeout_ms: 10000
    intent: >
      Task 7 added StatusStrip to the portal overview tab showing the client’s
      5-step SLA timeline (Brief → Design → Review → Approve → Live).
      We assert the component’s accessible wrapper is present to confirm it rendered.

  - id: s5b_client_assert_status_strip_text
    type: assert_text
    persona: client
    severity: warning
    description: "Task 7 — Status strip heading reads \"Your Launch Journey\""
    selector: '[data-testid="overview-tab-content"] h2, [aria-label="Website launch progress"] h2'
    contains: Launch Journey
    timeout_ms: 8000
    intent: >
      The StatusStrip heading must read \"Your Launch Journey\". This guards
      against copy regressions that would confuse clients about the workflow.

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 6: Client — Navigate tabs
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s6_client_click_edit_tab
    type: click
    persona: client
    severity: warning
    description: Client navigates to Edit tab
    selector: '[data-testid="portal-tab-edit"]'
    intent: Client clicks the Edit tab

  - id: s6_client_assert_editor_loads
    type: wait_for
    persona: client
    severity: warning
    description: Editor tab content loads
    selector: '[data-testid="editor-tab-content"]'
    timeout_ms: 10000
    intent: The editor content area should render

  # ───────────────────────────────────────────────────────────────────────────
  # SCENE 6b: Task 8 — Approve & Publish button present in editor toolbar
  # ───────────────────────────────────────────────────────────────────────────

  - id: s6b_client_assert_approve_button
    type: wait_for
    persona: client
    severity: warning
    description: "Task 8 — Approve & Publish (or Undo Approval) button visible in editor toolbar"
    # Rendered only when session.permissions.canApprove (or canUnaprove).
    # Button text: "Approve & Publish" or "Undo Approval".
    # No data-testid — match by button text.
    selector: 'button:has-text("Approve"), button:has-text("Undo Approval")'
    timeout_ms: 8000
    intent: >
      Task 8 moved the payment commit step to variant approval. The editor toolbar
      renders an \"Approve & Publish\" button (or \"Undo Approval\" if already approved).
      Clicking it when isPaid=false opens a PaymentGate that drives Stripe Checkout;
      on return with ?tab=edit&approve=1 the approval panel auto-opens.
      We assert the button is present — its label must be human-readable.

  - id: s6_client_click_audits_tab
    type: click
    persona: client
    severity: warning
    description: Client navigates to Audits tab
    selector: '[data-testid="portal-tab-audits"]'
    intent: Client clicks the Audits tab

  - id: s6_client_assert_audits_loads
    type: wait_for
    persona: client
    severity: warning
    description: Audits tab content loads
    selector: '[data-testid="audits-tab-content"]'
    timeout_ms: 8000
    intent: The audits tab content should render

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 7: Client — Billing Tab (pre-upgrade)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s7_client_click_billing_tab
    type: click
    persona: client
    severity: error
    description: Client navigates to Billing tab
    selector: '[data-testid="portal-tab-billing"]'
    intent: Client clicks the Billing tab

  - id: s7_client_assert_billing_loads
    type: wait_for
    persona: client
    severity: error
    description: Billing tab content loads
    selector: '[data-testid="billing-tab-content"]'
    timeout_ms: 10000
    intent: The billing tab content should render

  - id: s7_client_assert_upgrade_cards
    type: wait_for
    persona: client
    severity: warning
    description: Upgrade plan cards are visible
    selector: '[data-testid^="upgrade-plan-card-"]'
    timeout_ms: 8000
    intent: At least one upgrade plan card should be visible on the billing tab

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 8: Client — Initiate Stripe Checkout (standard plan)
  # NOTE: StripeAdapter.fillCheckoutForm() is called by the step executor
  # when it encounters the stripe_checkout step type in the scenario runner.
  # For the YAML, we assert the redirect happened after the click.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s8_client_click_upgrade_standard
    type: click
    persona: client
    severity: error
    description: Client clicks Upgrade on standard plan
    selector: '[data-testid="upgrade-btn-standard"]'
    intent: Client initiates upgrade to standard plan — should redirect to Stripe checkout

  - id: s8_client_assert_stripe_redirect
    type: wait_for
    persona: client
    severity: error
    description: Stripe checkout page loads
    selector: 'form[data-testid="stripe-checkout-form"], [data-testid="stripe-checkout-root"], .SubmitButton, #payment-form'
    timeout_ms: 30000
    intent: Stripe checkout page should load after clicking Upgrade

  - id: s8_client_pause_for_stripe
    type: pause
    persona: client
    severity: info
    description: Brief pause for Stripe Elements to fully initialise
    duration_ms: 2000
    intent: >
      Stripe Elements loads its iframe asynchronously after the checkout page renders.
      This 2s pause prevents race conditions where the StripeAdapter tries to fill
      card fields before the iframe is ready. In v1.5, replace with a wait_for targeting
      the Stripe iframe selector (e.g. iframe[name^='__privateStripeFrame']).

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 9: Client — Complete Stripe Checkout
  # (StripeAdapter fills card details via Playwright frameLocator)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s9_client_assert_checkout_success
    type: wait_for
    persona: client
    severity: error
    description: Wait for Stripe to return to success URL after payment
    selector: '[data-testid="billing-tab-content"]'
    timeout_ms: 60000
    intent: After Stripe checkout, client should be redirected back to the billing tab

  - id: s9_client_assert_success_banner
    type: wait_for
    persona: client
    severity: warning
    description: Checkout success banner is shown
    selector: '[data-testid="checkout-success-banner"], .checkout-success, [class*="success"]'
    timeout_ms: 10000
    intent: A success confirmation should be visible after checkout

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 10: Handoff — Client → Admin (verify subscription in DB)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s10_handoff_client_to_admin
    type: handoff
    persona: client
    severity: info
    description: Checkout complete — switching to admin to verify DB state
    from: client
    to: admin
    message: Client checkout complete — admin verifies subscription in database
    handoff_timeout_ms: 5000
    intent: Cross-persona handoff from client to admin for DB verification

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 11: Admin — Verify Subscription in DB
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s11_admin_pause_for_webhook
    type: pause
    persona: admin
    severity: info
    description: Allow Stripe webhook time to process (up to 10s)
    duration_ms: 10000
    intent: >
      After Stripe checkout completes, the platform receives a checkout.session.completed
      webhook that activates the subscription and updates the revenue widget.
      This 10s pause gives the webhook handler time to process before the admin
      navigates to the dashboard to verify. In v1.5, replace with an assert_db
      polling step that retries until subscription.status = 'active'.

  - id: s11_admin_navigate_dashboard
    type: navigate
    persona: admin
    severity: warning
    description: Admin refreshes dashboard to see updated revenue
    url: /admin/dashboard
    intent: Admin navigates to dashboard to verify billing state updated

  - id: s11_admin_assert_revenue_widget_updated
    type: wait_for
    persona: admin
    severity: warning
    description: Revenue widget re-renders post-checkout
    selector: '[data-testid="revenue-widget"]'
    timeout_ms: 10000
    intent: Revenue widget should re-render with updated subscription data

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 12: Admin — Tenant Detail Page
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s12_admin_assert_clients_table
    type: wait_for
    persona: admin
    severity: warning
    description: Clients table loads after webhook processing
    selector: '[data-testid="waas-clients-table"]'
    timeout_ms: 15000
    intent: The tenant list should load and reflect updated subscription status

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 13: Handoff — Admin → Client (post-upgrade portal check)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s13_handoff_admin_to_client
    type: handoff
    persona: admin
    severity: info
    description: Admin verification complete — switching back to client
    from: admin
    to: client
    message: Admin DB verification complete — returning to client portal for post-upgrade checks
    intent: Cross-persona handoff from admin back to client

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 14: Client — Post-Upgrade Portal State
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s14_client_navigate_billing
    type: navigate
    persona: client
    severity: warning
    description: Client navigates back to billing tab
    url: /edit/${QA_CLIENT_REVIEW_TOKEN}?tab=billing
    intent: Client navigates directly to billing tab to verify upgrade reflected

  - id: s14_client_assert_billing_reloads
    type: wait_for
    persona: client
    severity: warning
    description: Billing tab loads after upgrade
    selector: '[data-testid="billing-tab-content"]'
    timeout_ms: 15000
    intent: Billing tab should load and show updated plan information

  # ───────────────────────────────────────────────────────────────────────────
  # SCENE 14b: Task 8 — Post-payment approval panel auto-opens (?approve=1)
  # ───────────────────────────────────────────────────────────────────────────

  - id: s14b_client_navigate_edit_approve
    type: navigate
    persona: client
    severity: warning
    description: "Task 8 — Navigate to ?tab=edit&approve=1 (simulates Stripe return URL)"
    url: /edit/${QA_CLIENT_REVIEW_TOKEN}?tab=edit&approve=1
    intent: >
      Task 8’s success flow: after Stripe checkout, the client is redirected back
      to /edit/[token]?tab=edit&approve=1.  The portal-shell reads the approve=1
      query param and passes autoOpenApproval=true to EditorShell, which sets
      showApproval=true, immediately opening the ApprovalPanel modal.
      Simulating this redirect verifies the post-payment UX works end-to-end.

  - id: s14b_client_assert_approval_panel
    type: wait_for
    persona: client
    severity: warning
    description: "Task 8 — ApprovalPanel modal auto-opens after Stripe return"
    # ApprovalPanel renders as a fixed overlay; heading text is "Approve & Publish"
    # or "Subscribe to Publish" (PaymentGate) for still-unpaid tenants.
    # After successful checkout the tenant IS paid so the normal form shows.
    selector: 'dialog, [role="dialog"], .fixed.inset-0, button:has-text("Yes, Approve")'
    timeout_ms: 12000
    intent: >
      After being redirected from Stripe with ?approve=1, the ApprovalPanel modal
      should have opened automatically via the autoOpenApproval prop.
      We assert the overlay or confirm button is visible.

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 15: Client — Overview Tab Post-Upgrade
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s15_client_click_overview
    type: click
    persona: client
    severity: warning
    description: Client navigates to Overview tab
    selector: '[data-testid="portal-tab-overview"]'
    intent: Client checks overview tab post-upgrade

  - id: s15_client_assert_overview_loads
    type: wait_for
    persona: client
    severity: warning
    description: Overview tab content loads
    selector: '[data-testid="overview-tab-content"]'
    timeout_ms: 10000
    intent: Overview tab should load and show site status

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 16: Handoff — Client → Admin (final admin checks)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s16_handoff_client_to_admin_final
    type: handoff
    persona: client
    severity: info
    description: Final handoff back to admin for cleanup verification
    from: client
    to: admin
    message: Client post-upgrade checks done — admin performs final verification
    intent: Final cross-persona handoff from client to admin

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 17: Admin — Final Dashboard Check
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s17_admin_final_dashboard
    type: navigate
    persona: admin
    severity: warning
    description: Admin final dashboard check
    url: /admin/dashboard
    intent: Admin navigates to dashboard for final state verification

  - id: s17_admin_assert_dashboard_stable
    type: assert_text
    persona: admin
    severity: warning
    description: Dashboard heading still present (no crash)
    selector: '[data-testid="admin-dashboard-heading"]'
    contains: Command Center
    intent: Dashboard should still be stable after full lifecycle run

  - id: s17_admin_assert_revenue_present
    type: wait_for
    persona: admin
    severity: warning
    description: Revenue widget still renders
    selector: '[data-testid="revenue-widget"]'
    timeout_ms: 8000
    intent: Revenue widget should be present at end of full run

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 18: Admin — Tenant Detail (verify plan on tenant page)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s18_admin_assert_final_tenant_list
    type: wait_for
    persona: admin
    severity: warning
    description: Final tenant list loaded
    selector: '[data-testid="waas-clients-table"]'
    timeout_ms: 10000
    intent: Tenant list loads cleanly at end of run

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 19: Final Assert — Both Personas Healthy
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s19_handoff_admin_to_client_final
    type: handoff
    persona: admin
    severity: info
    description: Final cross-persona health check
    from: admin
    to: client
    message: Final persona switch — verifying client context still healthy
    intent: Ensure client browser context is still alive at end of run

  - id: s19_client_assert_still_on_portal
    type: assert_url
    persona: client
    severity: warning
    description: Client portal URL still valid at end of run
    pattern: /edit/
    intent: Client browser context should still be on the portal URL at end of run

  - id: s19_final_pause
    type: pause
    persona: client
    severity: info
    description: Final stabilisation pause before teardown
    duration_ms: 1000
    intent: >
      Brief 1s pause to let any in-flight network requests settle before
      PersonaRouter.teardown() closes both browser contexts. Prevents occasional
      "Target closed" Playwright errors on the last navigation. Safe to remove
      if teardown is made graceful in v1.5.

  # ═══════════════════════════════════════════════════════════════════════════
  # SCENE 20: Task 9 — Audit start page + PDF download link
  # ═══════════════════════════════════════════════════════════════════════════

  - id: s20_handoff_client_to_admin_audit
    type: handoff
    persona: client
    severity: info
    description: "Task 9 — Switch to admin persona to test audit flow"
    from: client
    to: admin
    message: Final portal checks done — admin verifies audit entry points
    intent: Cross-persona handoff to admin for audit route checks

  - id: s20_admin_navigate_audit_start
    type: navigate
    persona: admin
    severity: warning
    description: "Task 9 — Navigate to /audit/start (public audit entry point)"
    url: /audit/start
    intent: >
      Task 9 delivers the branded PDF audit + deep-link email flow.
      /audit/start is the public entry-point where visitors submit a domain.
      Verify it is reachable and renders its form.

  - id: s20_admin_assert_audit_start_loads
    type: wait_for
    persona: admin
    severity: warning
    description: "Task 9 — Audit start form renders (input + submit button)"
    selector: 'form, input[type="url"], input[type="text"], input[placeholder*="domain"], input[placeholder*="website"], main'
    timeout_ms: 15000
    intent: >
      The audit start form should render within a reasonable time.
      A failure here indicates /audit/start or its server component has regressed.

  - id: s20_admin_navigate_audit_result
    type: navigate
    persona: admin
    severity: info
    description: "Task 9 — Navigate to a known audit result page (requires QA_AUDIT_ID env var)"
    url: /audit/${QA_AUDIT_ID}
    intent: >
      If QA_AUDIT_ID is set, navigate to the public audit result page to verify
      the branded report page loads and the PDF download CTA is visible.
      Skipped gracefully (info severity) when QA_AUDIT_ID is not configured.

  - id: s20_admin_assert_pdf_download_cta
    type: wait_for
    persona: admin
    severity: info
    description: "Task 9 — PDF download CTA is visible on the audit result page"
    # EmailCaptureForm renders with button text: "Download PDF Report", "Get PDF →", etc.
    # The CTA triggers /api/audit/[auditId]/pdf (branded PDFKit output).
    selector: 'a[href*="/api/audit/"][href$="/pdf"], button:has-text("PDF"), a:has-text("PDF"), button:has-text("Download")'
    timeout_ms: 10000
    intent: >
      Task 9 rewrote the PDF route with a branded layout (navy header, grade badge,
      score bars, leaderboard, opportunities, footer CTA).
      The audit result page must surface at least one PDF download link/button so
      users can access the branded report.
