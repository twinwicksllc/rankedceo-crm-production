id: edge_03_empty_state
name: "Edge 03 — Empty & Zero-Data State Checks"
description: >
  Validates that all dashboard and portal views render gracefully when there
  is no data to display. Tests the admin dashboard with zero tenants,
  revenue widget with no transactions, and QA reports page with no runs.
  These checks prevent white screens, JS crashes, and misleading blank tables
  from reaching production.
modes:
  - smoke
  - full

steps:
  # ── Scene 01: Admin login ─────────────────────────────────────────────────
  - id: e03_s01_navigate_login
    type: navigate
    persona: admin
    severity: info
    url: "{{ BASE_URL }}/login?next=/admin/dashboard&adminOnly=1"
    description: "Navigate to admin login"
    intent: "Navigates to admin login page — required to access all authenticated admin pages in this zero-data scenario"

  - id: e03_s02_fill_email
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-email"], input#email, input[type="email"]'
    value: "{{ ADMIN_EMAIL }}"
    description: "Fill admin email"
    intent: "Fills admin email for login — selector data-testid=admin-email in app/(auth)/login/page.tsx"

  - id: e03_s03_fill_pass
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-password"], input#password, input[type="password"]'
    value: "{{ ADMIN_PASSWORD }}"
    description: "Fill admin password"
    intent: "Fills admin password — selector data-testid=admin-password in app/(auth)/login/page.tsx"

  - id: e03_s04_submit
    type: click
    persona: admin
    severity: info
    selector: '[data-testid="admin-login-submit"], button[type="submit"]'
    description: "Submit login"
    intent: "Submits login form — triggers supabase.auth.signInWithPassword() and redirects to /admin/dashboard on success"

  - id: e03_s05_assert_dashboard
    type: assert_url
    persona: admin
    severity: critical
    pattern: "/admin/dashboard"
    description: "Admin must reach dashboard"
    intent: "Critical gate — all subsequent steps require admin authentication. If this fails, the zero-data checks cannot run"

  # ── Scene 02: Dashboard empty-table rendering ─────────────────────────────
  - id: e03_s06_assert_revenue_widget
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='revenue-widget']"
    contains: ""
    description: "Revenue widget must be present even with $0 MRR"
    intent: "A missing revenue widget when MRR is zero means the widget crashes on null — check conditional rendering"

  - id: e03_s07_assert_clients_table
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='waas-clients-table']"
    contains: ""
    description: "Clients table container must render even with zero tenants"
    intent: "Clients table crashing on empty array is a common SSR error — check map() on potentially null data"

  - id: e03_s08_assert_no_js_crash
    type: assert_text
    persona: admin
    severity: critical
    selector: "body"
    contains: ""
    description: "Body must render without Application error or ChunkLoadError"
    intent: "Next.js unhandled error boundary fires when components throw during render — empty-state crashes surface here"

  # ── Scene 03: QA Reports empty ────────────────────────────────────────────
  - id: e03_s09_navigate_qa_reports
    type: navigate
    persona: admin
    severity: info
    url: "{{ BASE_URL }}/admin/qa-reports"
    description: "Navigate to QA reports page"
    intent: "Navigates to the QA reports admin page — this page calls listQaRuns() which returns an empty array when no runs exist. The page must handle the empty array gracefully"

  - id: e03_s10_assert_qa_heading
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='qa-reports-heading']"
    contains: "QA"
    description: "QA reports heading must be present"
    intent: "The data-testid=qa-reports-heading element is in app/admin/qa-reports/page.tsx — its presence confirms the page rendered without crashing on an empty qa_runs table"

  - id: e03_s11_assert_no_crash_on_empty_runs
    type: assert_text
    persona: admin
    severity: error
    selector: "body"
    contains: ""
    description: "Page must not show error when qa_runs table is empty"
    intent: "listQaRuns returning [] should render an empty state row, not a JS crash"

  # ── Scene 04: QA Scenarios empty ──────────────────────────────────────────
  - id: e03_s12_navigate_qa_scenarios
    type: navigate
    persona: admin
    severity: info
    url: "{{ BASE_URL }}/admin/qa-scenarios"
    description: "Navigate to QA scenarios management page"
    intent: "Navigates to QA scenarios management — this page calls listQaScenarios() which returns an empty array when no custom scenarios exist in qa.qa_scenarios"

  - id: e03_s13_assert_scenario_list
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='scenario-list']"
    contains: ""
    description: "Scenario list must render (even if empty)"
    intent: "Scenario list crashing on empty array — verify null safety in scenario-list.tsx"

  - id: e03_s14_assert_new_form_present
    type: assert_text
    persona: admin
    severity: warning
    selector: "[data-testid='new-scenario-id']"
    contains: ""
    description: "New scenario form input must always be present"
    intent: "The new scenario form should always be visible regardless of how many scenarios exist — it is rendered unconditionally in app/admin/qa-scenarios/page.tsx alongside the scenario list"

  # ── Scene 05: Client portal — zero reviews ───────────────────────────────
  - id: e03_s15_handoff_admin_to_client
    type: handoff
    persona: admin
    severity: info
    from: admin
    to: client
    message: "Admin pages verified — switching to client portal for zero-data checks"
    description: "Switch to client persona"
    intent: "Cross-persona handoff from admin to client — admin pages verified with zero data, now switching to client portal to test zero-reviews rendering"

  - id: e03_s16_navigate_portal
    type: navigate
    persona: client
    severity: critical
    url: "{{ BASE_URL }}/edit/{{ CLIENT_REVIEW_TOKEN }}"
    description: "Navigate to client portal"
    intent: "Navigates to client portal using the test review token — the portal should load even if the tenant has zero reviews, zero audits, and an unconfigured billing state"

  - id: e03_s17_assert_portal_root
    type: assert_text
    persona: client
    severity: critical
    selector: "[data-testid='client-portal-root']"
    contains: ""
    description: "Client portal root must be present"
    intent: "The data-testid=client-portal-root div is the outermost wrapper of portal-shell.tsx — its absence indicates the portal component failed to mount, likely due to null data from the token lookup"

  - id: e03_s18_click_overview_tab
    type: click
    persona: client
    severity: info
    selector: "[data-testid='portal-tab-overview']"
    description: "Click the overview tab"
    intent: "Clicks the Overview tab to test zero-reviews rendering — the overview tab typically contains charts and summary stats that crash when data is null instead of []"

  - id: e03_s19_assert_overview_content
    type: assert_text
    persona: client
    severity: error
    selector: "[data-testid='overview-tab-content']"
    contains: ""
    description: "Overview tab must render even with zero reviews"
    intent: "Zero-reviews state must show an empty state UI, not crash — common issue with chart libraries receiving empty data arrays"

  - id: e03_s20_click_reviews_tab
    type: click
    persona: client
    severity: info
    selector: "[data-testid='portal-tab-history']"
    description: "Click the reviews tab"
    intent: "Clicks the Reviews tab to test zero-reviews list rendering — the reviews list must render an empty state UI when reviews is [] rather than crashing with Cannot read properties of null (reading map)"

  - id: e03_s21_assert_reviews_content
    type: assert_text
    persona: client
    severity: error
    selector: "[data-testid='reviews-tab-content']"
    contains: ""
    description: "Reviews tab must render even with zero reviews"
    intent: "Reviews list rendering null instead of [] causes React crash — check API response handling"

  - id: e03_s22_handoff_back
    type: handoff
    persona: client
    severity: info
    from: client
    to: admin
    message: "Client empty-state checks complete — returning to admin for final health check"
    description: "Return to admin persona to close out"
    intent: "Cross-persona handoff back to admin to close out the empty-state run — confirms both contexts survived the zero-data scenario without crashes"

  - id: e03_s23_final_health_check
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='admin-dashboard-root']"
    contains: ""
    description: "Admin dashboard still healthy after empty-state run"
    intent: "Final health assertion — admin dashboard root must still be present at the end of the empty-state run, confirming no state corruption occurred across either persona context"
