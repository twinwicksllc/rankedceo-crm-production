id: edge_01_auth_failure
name: "Edge 01 — Auth Failure & Recovery"
description: >
  Validates that the application correctly handles bad credentials,
  shows appropriate error UI, and allows recovery with valid credentials.
  Also tests that a client with an invalid/expired review token gets a 404
  rather than a blank or broken portal.
modes:
  - smoke
  - full

steps:
  # ── Scene 01: Wrong password ───────────────────────────────────────────────
  - id: e01_s01_navigate_login
    type: navigate
    persona: admin
    severity: info
    url: "{{ BASE_URL }}/login?next=/admin/dashboard&adminOnly=1"
    description: "Navigate to admin login page"
    intent: "The admin login page is at /admin/login — if navigation fails, check that the login route exists and middleware is not redirecting authenticated users away from the login page before credentials are entered"

  - id: e01_s02_fill_wrong_creds
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-email"], input#email, input[type="email"]'
    value: "{{ ADMIN_EMAIL }}"
    description: "Fill valid email"
    intent: "We use a valid email with a wrong password (not a fake email) so the auth system actually attempts the lookup — testing the password-mismatch error path rather than the user-not-found path"

  - id: e01_s03_fill_wrong_pass
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-password"], input#password, input[type="password"]'
    value: "wrong_password_!@#$"
    description: "Fill deliberately wrong password"
    intent: "Fills a clearly invalid password with special characters to ensure the auth system is not silently accepting any non-empty string — the selector [data-testid='admin-password'] maps to the password input in app/(auth)/login/page.tsx"

  - id: e01_s04_submit_wrong
    type: click
    persona: admin
    severity: info
    selector: '[data-testid="admin-login-submit"], button[type="submit"]'
    description: "Submit with wrong password"
    intent: "Clicks the submit button to trigger the login server action — the action calls supabase.auth.signInWithPassword() and should receive an AuthApiError with message 'Invalid login credentials'"

  - id: e01_s05_assert_error_message
    type: assert_text
    persona: admin
    severity: error
    selector: "body"
    contains: "Invalid"
    description: "Page should contain an error/invalid message after failed login"
    intent: "Auth failure must show user-visible feedback — if this step breaks, check Supabase auth error propagation to the login form"

  - id: e01_s06_assert_still_on_login
    type: assert_url
    persona: admin
    severity: critical
    pattern: "/login"
    description: "User must stay on login page after failure"
    intent: "Redirect after failed auth would be a security regression"

  # ── Scene 02: Recovery with correct credentials ────────────────────────────
  - id: e01_s07_fill_correct_pass
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-password"], input#password, input[type="password"]'
    value: "{{ ADMIN_PASSWORD }}"
    description: "Overwrite password field with correct password"
    intent: "After the error UI is confirmed, we overwrite the password field with the correct value — the email field should retain its value from the previous fill, so only the password needs to be updated"

  - id: e01_s08_submit_correct
    type: click
    persona: admin
    severity: info
    selector: '[data-testid="admin-login-submit"], button[type="submit"]'
    description: "Submit with correct credentials"
    intent: "Re-submits the login form with correct credentials to verify the form is reusable after an error — the server action should now call supabase.auth.signInWithPassword() successfully and redirect to /admin/dashboard"

  - id: e01_s09_assert_dashboard
    type: assert_url
    persona: admin
    severity: critical
    pattern: "/admin/dashboard"
    description: "Successful login must land on dashboard"
    intent: "Post-auth redirect target — regression here breaks all subsequent admin flows"

  - id: e01_s10_assert_dashboard_root
    type: assert_text
    persona: admin
    severity: error
    selector: "[data-testid='admin-dashboard-root']"
    contains: ""
    description: "Dashboard root element must be present after recovery"
    intent: "The data-testid='admin-dashboard-root' div is the outermost wrapper of the admin dashboard layout in app/admin/dashboard/page.tsx — its presence confirms the React component tree mounted successfully, not just that the URL matched"

  # ── Scene 03: Invalid review token ────────────────────────────────────────
  - id: e01_s11_handoff_to_client
    type: handoff
    persona: admin
    severity: info
    from: admin
    to: client
    message: "Admin confirmed — switching to client to test invalid token handling"
    description: "Switch to client persona"
    intent: "Cross-persona handoff — the client browser context was pre-initialised by PersonaRouter.init() and navigated to the portal URL. After this handoff, the next steps run in the client context"

  - id: e01_s12_navigate_bad_token
    type: navigate
    persona: client
    severity: warning
    url: "{{ BASE_URL }}/edit/xxxxxxxx-invalid-token-00000000"
    description: "Navigate to portal with a fake review token"
    intent: "The /edit/[reviewToken] route looks up the token in the database — a fake token should trigger a notFound() call or return a 404 status. The test verifies the app handles this gracefully rather than crashing with an unhandled error"

  - id: e01_s13_assert_not_blank
    type: assert_text
    persona: client
    severity: warning
    selector: "body"
    contains: ""
    description: "Body must render something (not a blank white page)"
    intent: "Empty portal body suggests SSR crash rather than graceful 404"

  - id: e01_s14_wait_settled
    type: wait_for
    persona: client
    severity: info
    selector: "body"
    timeout_ms: 3000
    description: "Wait for page to settle after invalid token navigation"
    intent: "Gives Next.js time to finish rendering the 404 page or error boundary — without this wait, the subsequent step may read a partially rendered DOM"

  # ── Scene 04: Empty email submission ─────────────────────────────────────
  - id: e01_s15_handoff_back_to_admin
    type: handoff
    persona: client
    severity: info
    from: client
    to: admin
    message: "Invalid token check complete — returning to admin for form validation test"
    description: "Switch back to admin persona"
    intent: "Cross-persona handoff back to admin — the admin context is still authenticated from the successful login in Scene 02, so no re-login is needed"

  - id: e01_s16_navigate_login_again
    type: navigate
    persona: admin
    severity: info
    url: "{{ BASE_URL }}/login?next=/admin/dashboard&adminOnly=1"
    description: "Navigate back to login page for empty-field test"
    intent: "Navigating an authenticated admin to /admin/login tests whether middleware correctly shows the login form even when a session exists — some implementations redirect authenticated users away, which would prevent testing the empty-field validation"

  - id: e01_s17_clear_email
    type: fill
    persona: admin
    severity: info
    selector: '[data-testid="admin-email"], input#email, input[type="email"]'
    value: ""
    description: "Clear email field"
    intent: "Clears the email field to test HTML5 required attribute validation — page.fill() with '' programmatically empties the input, then the submit click should trigger the browser's built-in required-field validation popup"

  - id: e01_s18_submit_empty
    type: click
    persona: admin
    severity: error
    selector: '[data-testid="admin-login-submit"], button[type="submit"]'
    description: "Click submit with empty email — should be blocked by validation"
    intent: "Clicking submit with an empty required email field should trigger HTML5 form validation (checkValidity() returns false) and prevent form submission — the page URL must not change. If the form submits anyway, it means the input is missing 'required' or type='email' attributes, or the server action is not validating input"

  - id: e01_s19_assert_still_login
    type: assert_url
    persona: admin
    severity: error
    pattern: "/login"
    description: "Empty email submit must not navigate away from login page"
    intent: "HTML5 validation or server validation should block empty-email submit"
