id: smoke
name: Smoke — Core Navigation & Admin Dashboard
description: >
  Fast smoke test covering essential routes for both personas.
  No billing, no email. Runs on every PR against Vercel preview URL.
  Max runtime: ~2 minutes.
modes:
  - smoke
  - full
requires_stripe: false
requires_email: false

steps:
  # ── Admin: Login + Dashboard ──────────────────────────────────────────────

  - id: admin_navigate_login
    type: navigate
    persona: admin
    severity: critical
    description: Admin navigates to login page
    url: /login?next=/admin/dashboard&adminOnly=1
    intent: >
      The admin login page is at /login (not /admin/login). The middleware
      redirects unauthenticated /admin/* requests to /login?next=/admin/dashboard&adminOnly=1.
      Navigating directly to that URL skips the redirect hop.

  - id: admin_assert_login_page
    type: assert_url
    persona: admin
    severity: critical
    description: Confirm we are on the login page
    pattern: /login
    intent: Verify the browser is on the login page before filling credentials

  - id: admin_fill_email
    type: fill
    persona: admin
    severity: critical
    description: Fill admin email
    selector: '[data-testid="admin-email"], input#email, input[type="email"]'
    value: '${QA_ADMIN_EMAIL}'
    intent: Enter the admin email address into the login form

  - id: admin_fill_password
    type: fill
    persona: admin
    severity: critical
    description: Fill admin password
    selector: '[data-testid="admin-password"], input#password, input[type="password"]'
    value: '${QA_ADMIN_PASSWORD}'
    intent: Enter the admin password into the login form

  - id: admin_submit_login
    type: click
    persona: admin
    severity: critical
    description: Submit admin login
    selector: '[data-testid="admin-login-submit"], button[type="submit"]'
    intent: Click the login submit button

  - id: admin_assert_dashboard
    type: assert_url
    persona: admin
    severity: critical
    description: Confirm redirect to admin dashboard
    pattern: /admin
    intent: Verify the admin is redirected to the dashboard after login

  - id: admin_navigate_dashboard_explicit
    type: navigate
    persona: admin
    severity: critical
    description: Navigate explicitly to admin dashboard to ensure full page load
    url: /admin/dashboard
    intent: >
      After login redirect, navigate explicitly to /admin/dashboard.
      The stepNavigate waits for networkidle, ensuring the server component
      (DB queries, Supabase calls) finishes before asserting content.

  - id: admin_assert_dashboard_heading
    type: assert_text
    persona: admin
    severity: error
    description: Dashboard has a recognisable heading
    # The actual h1 text is "Command Center" — do NOT check for "Dashboard"
    selector: '[data-testid="admin-dashboard-heading"], h1'
    contains: Center
    timeout_ms: 20000
    intent: >
      The admin dashboard h1 reads "Command Center". We assert on "Center" so
      the test passes whether data-testid is present (after Vercel rebuild) or
      the plain h1 fallback is used.

  # ── Admin: Revenue Widget (on /admin/dashboard) ───────────────────────────

  - id: admin_assert_revenue_widget
    type: wait_for
    persona: admin
    severity: warning
    description: Revenue widget is visible on the dashboard
    # data-testid="revenue-widget" is on the /admin/dashboard page itself
    selector: '[data-testid="revenue-widget"], [data-testid="admin-dashboard-root"], h1'
    timeout_ms: 15000
    intent: The WaaS revenue widget should render on the dashboard page

  # ── Admin: WaaS Clients Table (also on /admin/dashboard) ─────────────────
  #
  # There is NO /admin/waas/clients route — the tenant list is rendered as
  # data-testid="waas-clients-table" directly on /admin/dashboard.

  - id: admin_assert_clients_table
    type: wait_for
    persona: admin
    severity: warning
    description: Wait for clients/tenants table to be visible on dashboard
    # waas-clients-table div is on /admin/dashboard — no separate route
    selector: '[data-testid="waas-clients-table"], [data-testid="admin-dashboard-root"] h2, h2'
    timeout_ms: 15000
    intent: >
      The WaaS tenant list (data-testid="waas-clients-table") lives on
      /admin/dashboard — there is no /admin/waas/clients route. We stay on
      the dashboard page and assert the div is visible.

  # ── Handoff: Admin → Client ───────────────────────────────────────────────

  - id: handoff_admin_to_client
    type: handoff
    persona: admin
    severity: info
    description: Switch to client persona
    from: admin
    to: client
    message: Admin checks complete — switching to client portal
    intent: Cross-persona handoff from admin to client context

  # ── Client: Edit Portal ───────────────────────────────────────────────────

  - id: client_assert_edit_portal
    type: assert_url
    persona: client
    severity: critical
    description: Client is on the edit portal
    pattern: /edit/
    intent: The client should be on their edit portal URL

  - id: client_assert_portal_loads
    type: wait_for
    persona: client
    severity: critical
    description: Client portal content loads
    selector: '[data-testid="client-portal-root"], main, body'
    timeout_ms: 15000
    intent: The client edit portal should render its main content area

  - id: client_assert_overview_tab
    type: wait_for
    persona: client
    severity: warning
    description: Overview tab button is visible (requires valid QA_CLIENT_REVIEW_TOKEN)
    # Tabs are <button> elements with data-testid="portal-tab-<id>"
    # Tab IDs: overview, edit, history, audits, billing
    # After Vercel rebuild (reactRemoveProperties:false), data-testid will work.
    # Until then: nav[aria-label="Portal tabs"] button is the reliable fallback.
    # NOTE: If QA_CLIENT_REVIEW_TOKEN is invalid, the portal shows a 404 page
    # with no tab nav — this step will warn but not block the smoke run.
    selector: '[data-testid="portal-tab-overview"], nav[aria-label="Portal tabs"] button, header nav button'
    timeout_ms: 10000
    intent: >
      The portal tab nav renders <button> elements inside a <nav aria-label="Portal tabs">.
      The first tab is data-testid="portal-tab-overview". We assert it is visible to confirm
      the portal shell has fully hydrated. Requires a valid QA_CLIENT_REVIEW_TOKEN secret.

  # ── Task 7: Status strip / SLA timeline ──────────────────────────────────

  - id: client_assert_status_strip
    type: wait_for
    persona: client
    severity: warning
    description: "Task 7 — Status strip (\"Your Launch Journey\") renders on overview tab"
    # StatusStrip renders inside overview-tab-content with role=list aria-label="Website launch progress"
    # The heading h2 reads "Your Launch Journey"
    selector: '[aria-label="Website launch progress"], [data-testid="overview-tab-content"] h2'
    timeout_ms: 10000
    intent: >
      Task 7 added the StatusStrip SLA timeline to the overview tab.
      We assert the component renders by checking its accessible aria-label.
      A warning (not critical) because it depends on valid QA_CLIENT_REVIEW_TOKEN
      and the portal having site-status data.

  - id: client_click_history_tab
    type: click
    persona: client
    severity: warning
    description: Client navigates to history tab
    # Tab IDs are: overview, edit, history, audits, billing
    # button has aria-label text "🕐 History" (with emoji prefix)
    selector: '[data-testid="portal-tab-history"], nav[aria-label="Portal tabs"] button:has-text("History"), header nav button:has-text("History")'
    intent: The client clicks on the History tab (formerly called "reviews")

  - id: client_assert_history_tab_active
    type: wait_for
    persona: client
    severity: warning
    description: History tab content loads
    selector: '[data-testid="portal-tab-history"][aria-current="page"], [data-testid="client-portal-root"] main, main'
    timeout_ms: 8000
    intent: The history tab content should render after navigation

  - id: client_click_billing_tab
    type: click
    persona: client
    severity: warning
    description: Client navigates to billing tab
    selector: '[data-testid="portal-tab-billing"], nav[aria-label="Portal tabs"] button:has-text("Billing"), header nav button:has-text("Billing")'
    intent: The client clicks on the Billing tab

  - id: client_assert_billing_tab_active
    type: wait_for
    persona: client
    severity: warning
    description: Billing tab content loads
    selector: '[data-testid="portal-tab-billing"][aria-current="page"], [data-testid="client-portal-root"] main, main'
    timeout_ms: 8000
    intent: The billing tab content should render after navigation

  # ── Task 8: Approve & Publish button in Edit tab ──────────────────────────

  - id: client_click_edit_tab_task8
    type: click
    persona: client
    severity: warning
    description: "Task 8 — Navigate to Edit tab to verify Approve & Publish button"
    selector: '[data-testid="portal-tab-edit"], nav[aria-label="Portal tabs"] button:has-text("Edit"), header nav button:has-text("Edit")'
    intent: Click the Edit tab — Task 8 wires the Approve & Publish action to trigger a payment gate when unpaid

  - id: client_assert_editor_loads_task8
    type: wait_for
    persona: client
    severity: warning
    description: Editor tab content loads
    selector: '[data-testid="editor-tab-content"]'
    timeout_ms: 10000
    intent: The editor tab content wrapper should render after clicking the Edit tab

  - id: client_assert_approve_button
    type: wait_for
    persona: client
    severity: warning
    description: "Task 8 — Approve & Publish (or Undo Approval) button is visible in editor toolbar"
    # Button renders when session.permissions.canApprove OR session.permissions.canUnaprove is true
    # Text is either "Approve & Publish" or "Undo Approval"
    selector: 'button:has-text("Approve"), button:has-text("Undo Approval"), [data-testid="editor-tab-content"] button'
    timeout_ms: 8000
    intent: >
      Task 8 gates the Approve & Publish button behind Stripe checkout when the
      tenant has no active subscription.  We assert the button (or Undo Approval
      for already-approved tenants) is visible in the editor toolbar.

  # ── Handoff: Client → Admin ───────────────────────────────────────────────

  - id: handoff_client_to_admin
    type: handoff
    persona: client
    severity: info
    description: Switch back to admin persona
    from: client
    to: admin
    message: Client portal checks complete — returning to admin context
    intent: Cross-persona handoff from client back to admin

  # ── Admin: Verify dashboard still loads ───────────────────────────────────

  - id: admin_navigate_back_to_dashboard
    type: navigate
    persona: admin
    severity: warning
    description: Admin returns to dashboard to confirm state
    url: /admin/dashboard
    intent: Admin navigates back to verify dashboard state is intact after context switch

  - id: admin_assert_dashboard_still_loaded
    type: wait_for
    persona: admin
    severity: warning
    description: Dashboard still renders after context switch
    selector: '[data-testid="admin-dashboard-root"], [data-testid="waas-clients-table"], h1'
    timeout_ms: 15000
    intent: The admin dashboard should still render correctly after the persona round-trip

  # ── Task 9: Audit start page reachable ────────────────────────────────────

  - id: admin_navigate_audit_start
    type: navigate
    persona: admin
    severity: warning
    description: "Task 9 — Audit start page is reachable"
    url: /audit/start
    intent: >
      Task 9 introduced the branded PDF audit + deep-link email flow.
      The entry-point is /audit/start where visitors submit a domain for analysis.
      We verify the page loads so a regression in the audit routes is caught on every PR.

  - id: admin_assert_audit_start_loads
    type: wait_for
    persona: admin
    severity: warning
    description: "Task 9 — Audit start form renders"
    # The audit start page renders a form with an email/domain input
    selector: 'form, input[type="url"], input[type="text"], input[placeholder*="domain"], input[placeholder*="website"], main'
    timeout_ms: 15000
    intent: >
      The audit start form should render within a reasonable time.
      If this fails, the /audit/start route or its server component has broken.
