<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2 style="margin: 0 0 16px; font-size: 20px;">Confirm your email</h2>
  <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.5;">
    Thanks for signing up for RankedCEO. Confirm your email address to finish creating your account.
  </p>
  <p style="margin: 24px 0;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #2563eb; color: #ffffff; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold;">Confirm my email</a>
  </p>
  <p style="margin: 0 0 8px; font-size: 13px; color: #6b7280;">
    If the button does not work, copy and paste this link into your browser:
  </p>
  <p style="margin: 0 0 16px; font-size: 13px; color: #6b7280; word-break: break-all;">{{ .ConfirmationURL }}</p>
  <p style="margin: 0; font-size: 13px; color: #6b7280;">If you did not sign up, you can ignore this email.</p>
</div>
